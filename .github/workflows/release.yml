name: Release


on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write       
  id-token: write       
  attestations: write   

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    

      - name: The tag and the csproj must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          num="${tag#v}"
          info=$(sed -n 's:.*<InformationalVersion>\(.*\)</InformationalVersion>.*:\1:p' LlamaServerLauncher.csproj | head -1)
          ver=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' LlamaServerLauncher.csproj | head -1)
          echo "tag $tag; csproj says Version=$ver, InformationalVersion=$info"
          if [ "$info" != "$tag" ]; then
            echo "::error::tag $tag does not match <InformationalVersion>$info</InformationalVersion> in LlamaServerLauncher.csproj"
            exit 1
          fi
          case "$ver" in
            "$num"|"$num".*) ;;
            *) echo "::error::tag $tag does not match <Version>$ver</Version> in LlamaServerLauncher.csproj"; exit 1 ;;
          esac

      - name: Release notes out of the changelogs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          # the body of the '## <tag> - <date>' section, without its blank edges
          section() {
            awk -v v="$tag" '$1 == "##" && $2 == v {f=1; next} f && $1 == "##" {exit} f {print}' "$1" \
              | awk 'NF {p=1} p' \
              | awk '{l[NR]=$0} END {for (i=NR; i>0 && l[i] ~ /^[[:space:]]*$/; i--); for (j=1; j<=i; j++) print l[j]}'
          }

          section CHANGELOG.ru.md > /tmp/ru.md
          section CHANGELOG.md    > /tmp/en.md
          date=$(awk -v v="$tag" '$1 == "##" && $2 == v {print $NF; exit}' CHANGELOG.md)
          case "$date" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) date="" ;;
          esac
          if [ ! -s /tmp/ru.md ] || [ ! -s /tmp/en.md ] || [ -z "$date" ]; then
            echo "::error::no '## $tag - YYYY-MM-DD' section in CHANGELOG.md or CHANGELOG.ru.md"
            exit 1
          fi
          ru_date=$(echo "$date" | awk -F- '{print $3 "." $2 "." $1}')

          images="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/raw/$tag/.github/release-notes"

          prev=$(git tag --list 'v*' --sort=-v:refname | awk -v cur="$tag" 'found {print; exit} $0 == cur {found=1}')
          if [ -n "$prev" ]; then
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$prev...$tag"
          else
            compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$tag"
          fi

          {
            echo "## Обновление от $ru_date"
            echo
            echo "## Список изменений"
            echo
            cat /tmp/ru.md
            echo
            echo "---"
            echo
            echo "<details>"
            echo "<summary>🇬🇧 English version (click to expand)</summary>"
            echo
            echo "## Update as of $date"
            echo
            echo "## Changelog"
            echo
            cat /tmp/en.md
            echo
            echo "</details>"
            echo
            if [ -f ".github/release-notes/$tag.md" ]; then
              sed -E -e "s#src=\"([^\"/]+\.(png|jpg|jpeg|gif|webp))\"#src=\"$images/\1\"#g" \
                     -e "s#\]\(([^)/]+\.(png|jpg|jpeg|gif|webp))\)#](${images}/\1)#g" \
                     ".github/release-notes/$tag.md"
              echo
            fi
            if [ -f ".github/release-notes/footer.md" ]; then
              cat ".github/release-notes/footer.md"
              echo
            fi
            echo "**Full Changelog**: $compare"
          } > /tmp/notes.md

          echo "::group::release notes"
          cat /tmp/notes.md
          echo "::endgroup::"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish all platforms
        run: |
          set -euo pipefail
          mkdir -p dist

          # RID  ->  output file name (matches publish.bat naming)
          publish() {
            local rid="$1" out="$2" host="$3"
            echo "::group::publish $rid"
            dotnet publish LlamaServerLauncher.csproj \
              -c Release -r "$rid" -o "publish/$rid" \
              --self-contained true /p:PublishSingleFile=true
            mv "publish/$rid/$host" "dist/$out"
            echo "::endgroup::"
          }

          publish win-x64    LlamaServerLauncher_win_x64.exe   LlamaServerLauncher.exe
          publish linux-x64  LlamaServerLauncher_linux_x64     LlamaServerLauncher
          publish osx-x64    LlamaServerLauncher_osx_x64       LlamaServerLauncher
          publish osx-arm64  LlamaServerLauncher_osx_arm64     LlamaServerLauncher

          ls -la dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: GPG sign checksums (optional)
        if: env.GPG_PRIVATE_KEY != ''
        working-directory: dist
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          gpg --batch --yes --pinentry-mode loopback \
            ${GPG_PASSPHRASE:+--passphrase "$GPG_PASSPHRASE"} \
            --local-user "$KEYID" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --armor --export "$KEYID" > LlamaServerLauncherAvalonia-public.asc

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/LlamaServerLauncher_win_x64.exe
            dist/LlamaServerLauncher_linux_x64
            dist/LlamaServerLauncher_osx_x64
            dist/LlamaServerLauncher_osx_arm64

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag \
            --draft

      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
